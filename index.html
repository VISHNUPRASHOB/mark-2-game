<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mark-II Racing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
      /* Prevent selection on touch devices */
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading Screen */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(0, 195, 255, 0.6), 0 0 40px rgba(0, 195, 255, 0.4);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: #a0aec0;
      letter-spacing: 6px;
      margin-bottom: 3rem;
      text-transform: uppercase;
    }

    .progress-container {
      width: 200px;
      height: 4px;
      background: #1a202c;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3182ce, #00c3ff);
      box-shadow: 0 0 10px rgba(0, 195, 255, 0.8);
      transition: width 0.2s ease-out;
    }

    .loading-text {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #718096;
      letter-spacing: 2px;
    }

    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      display: none; /* Shown via JS */
    }

    .hud-element {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .hud-speed {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    
    .hud-speed span {
      font-size: 1rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .hud-position {
      position: absolute;
      top: 2rem;
      left: 2rem;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 700;
    }

    .hud-lap {
      position: absolute;
      top: 2rem;
      right: 2rem;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 700;
    }

    .hud-minimap {
      position: absolute;
      top: 6rem;
      right: 2rem;
      width: clamp(100px, 20vw, 150px);
      height: clamp(100px, 20vw, 150px);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }

    .hud-countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 195, 255, 0.8);
      opacity: 0;
      transition: transform 0.2s, opacity 0.2s;
    }
    
    .hud-countdown.active {
      animation: pop-in 1s ease-out forwards;
    }

    @keyframes pop-in {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* UI Overlay */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; /* Active by default for menu */
      align-items: center;
      justify-content: center;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 90%;
      max-width: 800px;
    }
    
    .menu-title {
      font-size: clamp(2rem, 5vw, 3rem);
      color: #fff;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1rem;
    }

    .btn {
      min-height: 48px;
      min-width: 200px;
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c3ff, #0055ff);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #33ccff, #3377ff);
      box-shadow: 0 6px 20px rgba(0, 195, 255, 0.4);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #475569, #334155);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg, #64748b, #475569);
    }

    /* Car Selection */
    .car-select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .car-card, .level-card {
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .car-card h3, .level-card h3 {
      font-size: 1.5rem;
      margin: 0;
      text-align: center;
    }

    .car-card:hover, .level-card:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(0, 195, 255, 0.5);
      transform: translateY(-5px);
    }

    .car-card.selected, .level-card.selected {
      border-color: #00c3ff;
      box-shadow: 0 0 20px rgba(0, 195, 255, 0.3);
      background: rgba(15, 23, 42, 0.9);
    }

    .level-card {
      border-color: rgba(168, 85, 247, 0.3);
    }
    
    .level-card.selected {
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    
    .stat-label {
      font-size: 0.8rem;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-bar {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    /* Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 2rem;
      left: 0;
      width: 100%;
      padding: 0 2rem;
      display: none; /* Hidden by default, shown on touch devices */
      justify-content: space-between;
      pointer-events: none;
      z-index: 60;
    }
    
    .touch-group {
      display: flex;
      gap: 1rem;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: all 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    .touch-btn:active, .touch-btn.active {
      background: rgba(0, 195, 255, 0.4);
      border-color: rgba(0, 195, 255, 0.8);
      transform: scale(0.95);
    }
    
    .touch-btn-large {
      width: 80px;
      height: 80px;
    }

    .landscape-hint {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .landscape-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    @keyframes rotate-phone {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    /* Media Queries */
    @media (max-width: 768px) {
      .hud-element {
        padding: 0.5rem 1rem;
      }
      .hud-speed, .hud-position, .hud-lap {
        top: 1rem;
      }
      .hud-speed {
        bottom: 1rem;
        top: auto;
      }
      .hud-position { left: 1rem; }
      .hud-lap { right: 1rem; }
      
      .touch-btn { width: 50px; height: 50px; }
      .touch-btn-large { width: 70px; height: 70px; }
      #touch-controls { bottom: 1rem; padding: 0 1rem; }
    }

    @media (max-height: 400px) {
      .menu-container {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }
      .menu-title { margin-bottom: 0; }
      .car-select-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .car-card, .level-card { padding: 1rem; gap: 0.5rem; }
      .car-card h3, .level-card h3 { font-size: 1.2rem; }
      .stat-bar { height: 6px; }
      
      /* Scale HUD down a bit in landscape mobile */
      .hud-minimap {
        width: 80px; height: 80px; top: 4rem; right: 1rem;
      }
    }

    @media (orientation: portrait) and (max-width: 768px) {
      .landscape-hint {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1 class="logo">MARK-II</h1>
    <div class="subtitle">VPS GAME CREATOR</div>
    <div class="progress-container">
      <div class="progress-bar" id="loading-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Loading engine...</div>
  </div>

  <!-- Game Canvas Container -->
  <div id="game-container"></div>

  <!-- Heads Up Display (HUD) -->
  <div id="hud">
    <div class="hud-element hud-position">POS <span>1/4</span></div>
    <div class="hud-element hud-lap">LAP <span>1/3</span></div>
    <canvas class="hud-minimap" id="minimap-canvas"></canvas>
    
    <div class="hud-element hud-speed">
      <span id="speed-value">0</span> <br><span>KM/H</span>
    </div>
    
    <div class="hud-countdown" id="countdown">3</div>
  </div>

  <!-- UI Menus Overlay (populated dynamically by JS modules) -->
  <div id="ui-overlay" style="display: flex;"></div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <div class="touch-group">
      <div class="touch-btn" id="touch-left">◀</div>
      <div class="touch-btn" id="touch-right">▶</div>
    </div>
    <div class="touch-group">
      <div class="touch-btn" id="touch-brake">B</div>
      <div class="touch-btn touch-btn-large" id="touch-gas">▲</div>
    </div>
  </div>

  <!-- Portrait Orientation Hint -->
  <div class="landscape-hint">
    <div class="landscape-icon">📱</div>
    <h2>Please Rotate Device</h2>
    <p>Mark-II is best played in landscape mode.</p>
  </div>

  <!-- Game Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
