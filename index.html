<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MARK-II RACING — VPS Game Creator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ─── Loading Screen ─────────────────────────────────────────── */
    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0e1726 0%, #030712 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.6s ease-out;
    }

    .logo {
      font-size: clamp(3.5rem, 10vw, 6.5rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 25px rgba(0, 195, 255, 0.8), 0 0 50px rgba(0, 100, 255, 0.5);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #00e5ff;
      letter-spacing: 6px;
      margin-bottom: 2.5rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .progress-container {
      width: clamp(220px, 40vw, 320px);
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0077ff, #00f0ff);
      box-shadow: 0 0 15px #00f0ff;
      transition: width 0.2s ease-out;
    }

    .loading-text {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #94a3b8;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* ─── HUD Layer ──────────────────────────────────────────────── */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      display: none;
    }

    /* ─── UI Overlay ─────────────────────────────────────────────── */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Touch Controls Pad ─────────────────────────────────────── */
    #touch-controls {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      width: 100%;
      padding: 0 1.5rem;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 80;
    }

    .touch-cluster {
      display: flex;
      gap: 0.85rem;
      pointer-events: auto;
    }

    .touch-cluster-right {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      pointer-events: auto;
    }

    .touch-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transition: transform 0.08s ease, background-color 0.08s ease, border-color 0.08s ease;
      touch-action: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .touch-btn span {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: -2px;
      text-transform: uppercase;
    }

    .touch-btn:active, .touch-btn.active {
      transform: scale(0.92);
      background: rgba(0, 217, 255, 0.65) !important;
      border-color: #00f0ff !important;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8) !important;
    }

    .touch-btn-gas {
      width: 78px;
      height: 78px;
      background: rgba(16, 185, 129, 0.45);
      border-color: #10b981;
    }

    .touch-btn-brake {
      width: 64px;
      height: 64px;
      background: rgba(239, 68, 68, 0.4);
      border-color: #ef4444;
    }

    .touch-btn-drift {
      width: 62px;
      height: 62px;
      background: rgba(245, 158, 11, 0.45);
      border-color: #f59e0b;
      color: #fef08a;
    }

    /* ─── Landscape Device Orientation Hint ──────────────────────── */
    .landscape-hint {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(10px);
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }

    .landscape-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: rotate-phone 2s infinite ease-in-out;
    }

    @keyframes rotate-phone {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    .btn-dismiss-hint {
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    @media (orientation: portrait) and (max-width: 600px) {
      .landscape-hint:not(.dismissed) {
        display: flex;
      }
    }

    @media (max-width: 768px) {
      .touch-btn { width: 56px; height: 56px; font-size: 1.3rem; }
      .touch-btn-gas { width: 68px; height: 68px; }
      .touch-btn-brake { width: 54px; height: 54px; }
      .touch-btn-drift { width: 52px; height: 52px; }
      #touch-controls { bottom: 1rem; padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1 class="logo">MARK-II</h1>
    <div class="subtitle">VPS GAME CREATOR</div>
    <div class="progress-container">
      <div class="progress-bar" id="loading-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">INITIALIZING ENGINE...</div>
  </div>

  <!-- Game Canvas Container -->
  <div id="game-container"></div>

  <!-- Heads Up Display (HUD) -->
  <div id="hud"></div>

  <!-- UI Menus Overlay -->
  <div id="ui-overlay" style="display: flex;"></div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <!-- Left Hand: Steering -->
    <div class="touch-cluster">
      <button class="touch-btn" id="touch-left" aria-label="Steer Left">
        ◀
        <span>Left</span>
      </button>
      <button class="touch-btn" id="touch-right" aria-label="Steer Right">
        ▶
        <span>Right</span>
      </button>
    </div>

    <!-- Right Hand: Pedals & Drift -->
    <div class="touch-cluster-right">
      <button class="touch-btn touch-btn-drift" id="touch-drift" aria-label="Handbrake Drift">
        ⚡
        <span>Drift</span>
      </button>
      <button class="touch-btn touch-btn-brake" id="touch-brake" aria-label="Brake or Reverse">
        ■
        <span>Brake</span>
      </button>
      <button class="touch-btn touch-btn-gas" id="touch-gas" aria-label="Accelerate">
        ▲
        <span>Gas</span>
      </button>
    </div>
  </div>

  <!-- Portrait Orientation Hint -->
  <div class="landscape-hint" id="landscape-hint">
    <div class="landscape-icon">📱</div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Rotate Your Device</h2>
    <p style="color: #94a3b8; max-width: 280px;">For the best racing experience, rotate your phone to landscape mode.</p>
    <button class="btn-dismiss-hint" onclick="document.getElementById('landscape-hint').classList.add('dismissed')">Play in Portrait</button>
  </div>

  <!-- Game Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
